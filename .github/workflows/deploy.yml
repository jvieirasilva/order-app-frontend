name: CI/CD - Next.js App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Job 1: Build (corre em PRs e push para main) ───
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # Ignora erros de ESLint e TypeScript no build
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload artefacto do build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ─── Job 2: Deploy para Amplify (só em push para main) ───
  deploy:
    name: Deploy para AWS Amplify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger deploy no Amplify
        run: |
          echo "A iniciar deploy no Amplify..."
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Deploy iniciado! Job ID: $JOB_ID"

          echo "A aguardar conclusão do deploy..."
          for i in {1..30}; do
            STATUS=$(aws amplify get-job \
              --app-id ${{ secrets.AMPLIFY_APP_ID }} \
              --branch-name main \
              --job-id $JOB_ID \
              --query 'job.summary.status' \
              --output text)
            echo "  Status: $STATUS ($i/30)"
            if [ "$STATUS" == "SUCCEED" ]; then
              echo "✓ Deploy concluído com sucesso!"
              exit 0
            elif [ "$STATUS" == "FAILED" ] || [ "$STATUS" == "CANCELLED" ]; then
              echo "✗ Deploy falhou com status: $STATUS"
              exit 1
            fi
            sleep 20
          done
          echo "⚠️  Timeout a aguardar deploy"
          exit 1
