name: CI/CD - Next.js App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Job 1: Build (corre em PRs e push para main) ───
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # Ignora erros de ESLint e TypeScript no build
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload artefacto do build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  